# Read by the dnsmasq instance NetworkManager starts for shared (hotspot) connections.
# Every hostname resolves to the board: phones see their connectivity check land
# on our redirector and open the portal.
address=/#/@AP_IP@
# RFC 8910 / 7710 captive portal URI (iOS 14+, Android 11+)
dhcp-option=114,"http://@AP_IP@/"
# no internet behind us, don't hand out upstream resolvers
no-resolv
# Fewer packets per lease: the hotspot shares the 2.4 GHz radio with Bluetooth,
# and lost DHCP offers made phones give up with "IP configuration failure"
# (seen 2026-11-17: two DISCOVER/OFFER rounds unanswered, then a reconnect).
# Rapid commit (RFC 4039) lets a phone take its address in one exchange;
# authoritative answers a phone asking for its old address at once.
dhcp-rapid-commit
dhcp-authoritative
